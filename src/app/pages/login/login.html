<div class="login-container">
  <div class="login-card">
    <!-- LOGO -->

    <div class="login-logo">EN</div>

    <!-- TÍTULO -->

    <h1>ElectroNorte S.A.</h1>

    <p class="subtitulo">Mesa de Ayuda para Incidencias Eléctricas</p>

    <!-- FORMULARIO -->

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="email"> Correo electrónico </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password"> Contraseña </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
          required
        />
      </div>

      <!-- ERROR -->

      <div *ngIf="mensajeError" class="error">
        {{ mensajeError }}
      </div>

      <!-- BOTÓN -->

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</div>
